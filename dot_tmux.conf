# ------- README -------
# prefix - C-a
# prefix + R/I(Shift) - Reload tmux config
# prefix + U - Updated and uninstall plugins
# # Windows management
# prefix + p - Previous window
# prefix + n - Next window
# # Pane management
# prefix + | - Split current pane vertically into 2
# prefix + - - Split current pane horizontally into 2
# prefix + shift + h - resize current pane to <- left
# prefix + shift + j - resize              down
# prefix + shift + k - resize current pane to  -> right
# prefix + shift + l - resize current pane to up
# # Others
# prefix + j - Jump to a word in tmux window
### prefix + j, type the first letter, use the highlighted letter to jump
# around.
# prefix o - start/pause pomodoro
# prefix O - stop pomodoro
# prefix e - restart pomodoro
#
#
# prefix u - Update and uninstall plugins
# -------------------------------------------------

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a

# Unbind default pane split keys
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off
# Pomodoro override
set -g @pomodoro_toggle 'o'                    # Start/pause a Pomodoro/break
set -g @pomodoro_cancel 'O'                    # Cancel the current session
set -g status-right "#{pomodoro_status}"

# Tmux Plugin - https://github.com/tmux-plugins/tpm
## List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

### Other examples:
### set -g @plugin 'github_username/plugin_name'
### set -g @plugin 'github_username/plugin_name#branch'
### set -g @plugin 'git@github.com:user/plugin'
### set -g @plugin 'git@bitbucket.com:user/plugin'
##
### Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
